<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas DevOps</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="contenedor">

    <h1>Gestor de Tareas DevOps</h1>

    <div class="entrada">

        <input
            type="text"
            id="nuevaTarea"
            placeholder="Escriba una tarea">

        <button onclick="agregarTarea()">
            Agregar
        </button>

    </div>

    <p id="contador">
        Tareas pendientes: 0
    </p>

    <ul id="lista"></ul>

</div>

<script src="js/app.js"></script>

</body>
</html>
